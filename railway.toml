[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
# Core Configuration
NODE_ENV = "production"
IS_MULTIWORKSPACE_ENABLED = "true"
SERVER_URL = "https://${{RAILWAY_PUBLIC_DOMAIN}}"
FRONT_BASE_URL = "https://${{RAILWAY_PUBLIC_DOMAIN}}"
FRONTEND_URL = "https://${{RAILWAY_PUBLIC_DOMAIN}}"

# Database Configuration (Railway Postgres)
PG_DATABASE_URL = "${{DATABASE_URL}}"

# Redis Configuration (Railway Redis)
REDIS_URL = "${{REDIS_URL}}"

# Security
APP_SECRET = "${{APP_SECRET}}"
ACCESS_TOKEN_SECRET = "${{ACCESS_TOKEN_SECRET}}"
LOGIN_TOKEN_SECRET = "${{LOGIN_TOKEN_SECRET}}"
REFRESH_TOKEN_SECRET = "${{REFRESH_TOKEN_SECRET}}"
FILE_TOKEN_SECRET = "${{FILE_TOKEN_SECRET}}"

# Storage Configuration
STORAGE_TYPE = "local"
STORAGE_LOCAL_PATH = ".local-storage"

# Email Configuration (Optional - configure as needed)
# EMAIL_DRIVER = "smtp"
# EMAIL_FROM_ADDRESS = "noreply@yourdomain.com"
# EMAIL_FROM_NAME = "Twenty CRM"
# EMAIL_SMTP_HOST = "${{EMAIL_SMTP_HOST}}"
# EMAIL_SMTP_PORT = "${{EMAIL_SMTP_PORT}}"
# EMAIL_SMTP_USER = "${{EMAIL_SMTP_USER}}"
# EMAIL_SMTP_PASSWORD = "${{EMAIL_SMTP_PASSWORD}}"

# Performance
MUTATION_MAXIMUM_AFFECTED_RECORDS = "1000"

# Disable features that might cause issues in Railway
DISABLE_CRON_JOBS_REGISTRATION = "false"
DISABLE_DB_MIGRATIONS = "false"

# Client Configuration
CHROME_EXTENSION_ID = "bggmipldbceihilonnbpgoeclgbkblkp"